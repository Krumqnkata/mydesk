[package]
name = "mydesk"
version = "0.1.0"
edition = "2024"
description = "MyDesk - fast, encrypted remote desktop for Windows and Linux"
license = "MIT"
authors = ["Krum"]
repository = "https://github.com/Krumqnkata/mydesk"
readme = "README.md"
keywords = ["remote-desktop", "screen-sharing", "egui", "h264", "remote-control"]
categories = ["network-programming", "gui"]

[[bin]]
name = "mydesk"
path = "src/main.rs"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
xcap = "0.9.10"
openh264 = "0.9.9"
enigo = "0.6.1"
arboard = "3.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
bincode = "1.3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
socket2 = "0.5"
dirs = "6"
rfd = "0.15"
lz4_flex = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 3
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
