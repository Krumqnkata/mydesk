name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Make sure the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "MyDesk $GITHUB_REF_NAME" --generate-notes

  build:
    needs: create
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-24.04
            name: linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev \
            libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev \
            libwayland-dev libxkbcommon-dev libgbm-dev libegl1-mesa-dev libxdo-dev
      - name: Build
        run: cargo build --release
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/mydesk | Out-Null
          Copy-Item target/release/mydesk.exe, README.md, LICENSE dist/mydesk/
          Compress-Archive -Path dist/mydesk/* -DestinationPath dist/mydesk-${{ matrix.name }}.zip -Force
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/mydesk
          cp target/release/mydesk README.md LICENSE packaging/mydesk.desktop dist/mydesk/
          cp docs/logo.svg dist/mydesk/mydesk.svg
          tar -C dist -czf dist/mydesk-${{ matrix.name }}.tar.gz mydesk
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/mydesk-${{ matrix.name }}.* --clobber --repo "$GITHUB_REPOSITORY"
